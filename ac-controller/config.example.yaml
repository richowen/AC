# Default configuration for ac-controller.
# Runtime overrides made via the GUI are stored in SQLite and take precedence.

home_assistant:
  # URL and token come from HA_URL / HA_TOKEN environment variables.
  # They're not listed here on purpose.

entities:
  room_temp: sensor.0xa4c138cfaad13a80_temperature
  outdoor_temp: sensor.gw1100a_outdoor_temperature
  ac_power: switch.air_conditioner_switch
  ac_climate: climate.air_conditioner
  bypass: input_boolean.ac_bypass

control:
  heat_below: 21.0
  cool_above: 23.0
  hysteresis: 1.0
  debounce_seconds: 300
  min_cycle_seconds: 600
  stale_sensor_seconds: 600
  heat_target_c: 31
  cool_target_c: 18

cooling_outdoor_gate:
  enabled: true
  min_outdoor_c: 17

schedule:
  enabled: true
  start: "08:00"
  end: "23:00"

app:
  # Maximum number of events retained in the SQLite event log
  event_log_limit: 500
  # Controller tick period (evaluates FSM even when no state change occurs).
  # Used to check staleness, schedule boundaries, debounce expiry.
  tick_seconds: 30