services:
  ac-controller:
    build: .
    container_name: ac-controller
    restart: unless-stopped
    environment:
      HA_URL: ${HA_URL:-http://192.168.1.3:8123}
      HA_TOKEN: ${HA_TOKEN}
      TZ: ${TZ:-Europe/London}
    volumes:
      - /mnt/user/appdata/ac-controller:/data
    ports:
      - "8765:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
