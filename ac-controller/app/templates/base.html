<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AC Controller</title>
  <!-- Tailwind CSS (CDN — suitable for home-server use) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12/dist/htmx.min.js"></script>
  <style>
    .mode-off    { @apply bg-gray-600 text-white; }
    .mode-heat   { @apply bg-orange-500 text-white; }
    .mode-cool   { @apply bg-blue-500 text-white; }
    .mode-auto   { @apply bg-green-600 text-white; }
    .pending-dot { animation: pulse 1.5s cubic-bezier(0.4,0,0.6,1) infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-full font-sans">

  <!-- Nav -->
  <nav class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex items-center gap-6">
    <span class="font-bold text-lg tracking-tight">❄️ AC Controller</span>
    <a href="/"        class="text-sm text-gray-300 hover:text-white transition">Dashboard</a>
    <a href="/events"  class="text-sm text-gray-300 hover:text-white transition">Events</a>
    <a href="/settings" class="text-sm text-gray-300 hover:text-white transition">Settings</a>
    <!-- HA connection dot — updated via WS -->
    <span class="ml-auto flex items-center gap-2 text-xs text-gray-400">
      <span id="ha-dot" class="inline-block w-2 h-2 rounded-full bg-gray-500"></span>
      <span id="ha-label">connecting…</span>
    </span>
  </nav>

  <!-- Content -->
  <main class="max-w-3xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- WebSocket live-update script -->
  <script>
    (function () {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);
      const haDot   = document.getElementById('ha-dot');
      const haLabel = document.getElementById('ha-label');

      ws.onmessage = function (ev) {
        try {
          const s = JSON.parse(ev.data);
          // Connection indicator
          if (haDot && haLabel) {
            if (s.ha_connected) {
              haDot.className = 'inline-block w-2 h-2 rounded-full bg-green-400';
              haLabel.textContent = 'HA connected';
            } else {
              haDot.className = 'inline-block w-2 h-2 rounded-full bg-red-500';
              haLabel.textContent = 'HA disconnected';
            }
          }
          // Delegate to page-specific handler if present
          if (typeof window.onAcState === 'function') window.onAcState(s);
        } catch (e) { /* ignore */ }
      };

      ws.onclose = function () {
        if (haDot)   haDot.className   = 'inline-block w-2 h-2 rounded-full bg-yellow-400';
        if (haLabel) haLabel.textContent = 'WS disconnected';
        // Reconnect after 3s
        setTimeout(() => location.reload(), 3000);
      };
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
